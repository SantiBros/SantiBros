name: Generate profile snake and stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#FF6A2B&color_dots=#ebedf0,#ffd2bf,#ffa47f,#ff7a42,#e0521a
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF6A2B&color_dots=#161b22,#5a2a17,#8a3c1d,#c44f22,#ff6a2b

      - name: Build stats and languages cards
        run: python3 scripts/make_cards.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
